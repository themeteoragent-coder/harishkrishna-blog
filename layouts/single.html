{{ partial "header.html" . }}

<div class="post-header">
  <h1 class="post-title">{{ .Title | markdownify }}</h1>
  {{ with .Params.description }}<p class="post-tagline">{{ . | markdownify }}</p>{{ end }}
  {{ if (gt .Params.date 0) }}<p class="post-date">{{ .Date.Format "January 2, 2006" }}</p>{{ end }}
</div>

<main>
{{ .Content }}
</main>

{{ partial "footer.html" . }}
