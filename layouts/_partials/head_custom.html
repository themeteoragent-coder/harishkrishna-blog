<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

<style>
  .blog-header {
    text-align: center;
    margin-bottom: 2em;
  }
  .blog-title {
    font-family: 'Noto Serif', Georgia, 'Times New Roman', serif;
    font-size: 1.3em;
    font-weight: 600;
    margin-bottom: 0.3em;
  }
  .blog-tagline {
    font-family: 'Noto Serif', Georgia, 'Times New Roman', serif;
    font-size: 0.85em;
    color: #666;
    font-style: italic;
    margin: 0 0 0.6em 0;
  }
  .twitter-bird {
    display: inline-block;
    opacity: 0.5;
    transition: opacity 0.2s;
  }
  .twitter-bird svg {
    fill: #444;
    display: block;
  }
  .twitter-bird:hover {
    opacity: 1;
  }

  .post-header {
    margin-bottom: 1.5em;
  }
  .post-title {
    font-family: 'Noto Serif', Georgia, 'Times New Roman', serif;
    font-size: 1.6em;
    font-weight: 700;
    margin-bottom: 0.2em;
  }
  .post-tagline {
    font-family: 'Noto Serif', Georgia, 'Times New Roman', serif;
    font-size: 0.95em;
    color: #555;
    font-style: italic;
    margin: 0 0 0.3em 0;
  }
  .post-date {
    font-size: 0.8em;
    color: #888;
    margin: 0;
  }

  /* First image in a post: float left, text wraps beside it */
  main img:first-of-type {
    float: left;
    max-width: 42%;
    height: auto;
    margin: 0.35em 1.4em 0.9em 0;
  }

  /* Any later images stay centered on their own line */
  main img {
    display: block;
    margin: 1.8em auto;
    max-width: 100%;
    height: auto;
  }

  /* keep the float from bleeding into the footer */
  main::after {
    content: "";
    display: block;
    clear: both;
  }

  /* on narrow screens, don't squeeze the text beside the float */
  @media (max-width: 600px) {
    main img:first-of-type {
      float: none;
      max-width: 100%;
      margin: 1.5em auto;
    }
  }


</style>
