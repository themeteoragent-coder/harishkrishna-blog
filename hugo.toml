baseURL = "https://harishkrishna.me/"
locale = "en-US"
title = "Harish Krishna"
theme = "hugo-xmin"
enableRobotsTXT = true

[permalinks]
  posts = "/posts/:slug/"

[params]
  description = "Personal blog by Harish Krishna — tech, books, and thoughts."
  footer = "&copy; [Harish Krishna](https://harishkrishna.me) {Year}"

[menu]
  [[menu.main]]
    name = "Home"
    url = ""
    weight = 1
  [[menu.main]]
    name = "Posts"
    url = "posts/"
    weight = 2
  [[menu.main]]
    name = "About"
    url = "about/"
    weight = 3
  [[menu.main]]
    name = "Tags"
    url = "tags/"
    weight = 4

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
